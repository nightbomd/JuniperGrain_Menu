<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu | Juniper & Grain</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  
<header>
  <div class="container gap-5 d-flex align-items-center justify-content-center gap-4 p-3 mb-3">
    <img
        class=" logo"
        src="img/logo.png"
        alt="Juniper & Grain logo"
    >
    <div class="text-center d-flex flex-column gap-2">
    <h1 class="fs-1 sage-font">Our Menu</h1>
    <hr>
    <p class="fs-3 text-start">We sell food!</p>
    </div>
    </div>
</header>



  <main>
    <!-- Your script builds one button per category in here. -->
    <nav id="filters"></nav>

    <!-- Loading and error messages go here. -->
    <p id="status"></p>

    <!-- Your script builds the category headings and item cards in here. -->
    <section id="menu"></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</html>
